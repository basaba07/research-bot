model:
  default: claude-sonnet-4-6        # change to your preferred model
  provider: anthropic                # anthropic | openai | openrouter | custom
  # base_url: http://localhost:11434/v1   # uncomment for local/custom endpoints

providers: {}
fallback_providers: []
credential_pool_strategies: {}

toolsets:
- hermes-cli

agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []

terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  persistent_shell: true

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false

checkpoints:
  enabled: true
  max_snapshots: 50
  auto_prune: false
  retention_days: 7

file_read_max_chars: 100000

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400

prompt_caching:
  cache_ttl: 5m

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

delegation:
  max_iterations: 50
  child_timeout_seconds: 600
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false

approvals:
  mode: manual
  timeout: 60
  cron_mode: deny

cron:
  wrap_response: true
  max_parallel_jobs: null

logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3

sessions:
  auto_prune: false
  retention_days: 90

_config_version: 23

# ── Custom Providers ──────────────────────────────────────────────────
# Uncomment and configure for local or custom OpenAI-compatible endpoints.
#
# custom_providers:
# - name: local-ollama
#   base_url: http://localhost:11434/v1
#   model: your-model-name
